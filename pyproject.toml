[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "depthreach"
version = "0.1.0"
description = "AI-powered prospect research and cold email generation tool"
requires-python = ">=3.9"
dependencies = [
    "tavily-python>=0.3.0",
    "google-generativeai>=0.8.0",
    "requests>=2.31.0",
]

[project.scripts]
depthreach = "depthreach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
